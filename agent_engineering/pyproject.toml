[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bohrium-agent-interview"
version = "0.1.0"
description = "Runnable starter repository for the Bohrium agent engineering interview"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pymysql>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*", "agent*", "db*", "tools*", "eval*", "mock_boh_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

