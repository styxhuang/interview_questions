services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: agent_interview
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://agent:agent@mysql:3306/agent_interview
      MOCK_BOH_STATE: /app/var/mock_bohrium_state.json
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mock_state:/app/var

volumes:
  mysql_data:
  mock_state:
